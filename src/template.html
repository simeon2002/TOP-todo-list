<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
  </head>
  <body>
    <div class="app-container">
      <nav class="nav">
        <div class="user-container">
          <div class="user-details">
            <p class="user-details__user-name">Simeon serafimov</p>
          </div>
        </div>
        <div class="nav-container">
          <ul class="list nav-list">
            <li class="item nav-item">
              <button class="btn btn--create-task">
                <ion-icon class="icon-add-task" name="add-outline"></ion-icon><span>Add task</span>
              </button>
            </li>
            <li class="item nav-item">
              <button type="button" class="btn btn--nav btn--inbox">Inbox</button>
            </li>
            <li class="item nav-item">
              <button type="button" class="btn btn--nav">All Tasks</button>
            </li>
            <li class="item nav-item">
              <button type="button" class="btn btn--nav btn--projects">
                <span>Projects</span> <ion-icon class="icon icon--chevron" name="chevron-down-outline"></ion-icon>
              </button>
              <div class="project-list-container">
                <ul class="list project-list">
                  <!-- <li class="item project-item"><button class="btn btn--nav">Project Name</button></li>
                  <li class="item project-item"><button class="btn btn--nav">Project Name</button></li> -->
                </ul>
              </div>
            </li>
          </ul>
        </div>
      </nav>
      <main class="main-container">
        <article class="project">
          <div class="add-task-container">
            <div class="project__divider project__divider--add-task"></div>
            <button class="btn btn--create-task">
              <ion-icon class="icon-add-task" name="add-outline"></ion-icon><span>Add task</span>
            </button>
          </div>
        </article>
      </main>
      <dialog>
        <form class="task-form" data-id="">
          <header>
            <h1 class="heading-primary">New Task</h1>
            <button type="button" class="btn btn--close-form">
              <ion-icon class="icon icon--close-btn-form" name="close-outline"></ion-icon>
            </button>
          </header>
          <div class="form-inputs-container">
            <div class="form-container name-container">
              <label for="task-name">Name</label>
              <input type="text" id="task-name" name="task-name" required minlength="1" />
            </div>
            <div class="form-container desc-container">
              <label for="task-desc">Description</label>
              <textarea name="task-desc" id="task-desc" placeholder="Add a task description here" rows="2" spellcheck="false"></textarea>
            </div>
            <div class="form-container project-name-container">
              <label for="project">Project</label>
              <select name="project" id="project"></select>
            </div>
            <div class="form-container date-container">
              <label for="due-date">Date</label>
              <input type="date" name="due-date" id="due-date" />
            </div>
            <div class="form-container priority-container">
              <label for="task-priority">Priority</label>
              <select name="task-priority" id="task-priority" required>
                <option value="low" selected>Low Priority</option>
                <option value="medium">Medium Priority</option>
                <option value="high">High Priority</option>
              </select>
            </div>
            <div class="form-container tags-container">
              <label for="task-tags">Tags</label>
              <input type="text" id="task-tags" name="task-tags" placeholder="e.g. tag1,tag2,tag3" />
            </div>
          </div>
          <div class="submit-container">
            <button type="submit" class="btn btn--form-submit">Create Task</button>
          </div>
          <input type="hidden" name="form-type" value="create-task" />
        </form>
      </dialog>
    </div>
  </body>
</html>
